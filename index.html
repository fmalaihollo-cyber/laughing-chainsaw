<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<meta name="theme-color" content="#0E7C6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F3;--surface:#fff;--ink:#16201E;--mute:#66736F;--line:#DDE3E0;--accent:#0E7C6B;--on:#fff;--p1:#D1344B;--p2:#E08A1E;--p3:#3B73D1;--over:#C23B2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101514;--surface:#182120;--ink:#E6EEEB;--mute:#93A29D;--line:#273331;--accent:#3CC2A9;--on:#06201B;--over:#FF7A6B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101514;--surface:#182120;--ink:#E6EEEB;--mute:#93A29D;--line:#273331;--accent:#3CC2A9;--on:#06201B;--over:#FF7A6B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 170px;max-width:640px;margin-inline:auto;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
h1{font-size:2rem;line-height:1.1;margin:8px 0 2px;font-weight:700}
h2{font-size:1rem;margin:26px 0 8px;font-weight:600;color:var(--mute)}
h2.over{color:var(--over)}
h3{margin:0 0 14px;font-size:1.25rem}
.sub{margin:0 0 6px;color:var(--mute)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 4px 12px 0;border-bottom:1px solid var(--line)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:transparent;margin-top:1px;padding:0}
.p1 .chk{border-color:var(--p1)}.p2 .chk{border-color:var(--p2)}.p3 .chk{border-color:var(--p3)}
.done .chk{background:var(--accent);border-color:var(--accent)}
.done .tt{text-decoration:line-through;color:var(--mute)}
.tb{flex:1;min-width:0}
.tt{overflow-wrap:anywhere}
.tm{font-size:.85rem;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.tm .od{color:var(--over);font-weight:600}
.sub label,label.sub{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--mute);margin-top:6px}
.empty{color:var(--mute);padding:28px 0}
.pcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.pcard .info{flex:1;min-width:0}
.pcard .nm{font-weight:600;overflow-wrap:anywhere}
.pcard .st{font-size:.85rem;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--accent))}
.days{text-align:right;min-width:64px}
.big{font-size:2.1rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.days small{display:block;font-size:.75rem;color:var(--mute)}
.days.over .big,.days.over small{color:var(--over)}
.link{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:600}
.back{margin-bottom:4px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.btns{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:16px 0;color:var(--mute);font-weight:600}
nav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on);font-size:2rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:none;max-width:640px;margin-inline:auto}
.open #scrim,.open #sheet{display:block}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;margin:4px 0 12px}
label{display:block;font-size:.85rem;color:var(--mute)}
input[type=checkbox]{width:auto;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.acts button{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:600}
.acts .primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.acts .danger{color:var(--over);margin-right:auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" data-act="new-task" aria-label="Add task">+</button>
<nav><button data-v="today">Today</button><button data-v="upcoming">Upcoming</button><button data-v="projects">Projects</button></nav>
<div id="scrim" data-act="close"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<script>
const $=s=>document.querySelector(s);
const COL=['#0E7C6B','#D1344B','#3B73D1','#E08A1E','#7A4FD0','#B5651D','#C2417A','#2A8FB5'];
const RLAB={daily:'Daily',weekdays:'Weekdays',weekly:'Weekly',monthly:'Monthly'};
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dlabel(s){const n=diff(s,today());if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';return parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function load(){try{const r=localStorage.getItem('tasks-v1');if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.tasks)&&Array.isArray(d.projects))return d}}catch(e){}return{projects:[],tasks:[]}}
function save(){try{localStorage.setItem('tasks-v1',JSON.stringify(S))}catch(e){}}
let S=load(),view='today';
const cmp=(a,b)=>{const x=a.due||'9',y=b.due||'9';return x<y?-1:x>y?1:a.pri-b.pri};
const proj=id=>S.projects.find(p=>p.id===id);
function nextDue(t){let d=t.due;do{if(t.repeat==='daily')d=addDays(d,1);else if(t.repeat==='weekdays'){d=addDays(d,1);while([0,6].includes(parse(d).getDay()))d=addDays(d,1)}else if(t.repeat==='weekly')d=addDays(d,7);else{const x=parse(d);x.setMonth(x.getMonth()+1);d=ymd(x)}}while(d<today());return d}
function taskRow(t){
  const p=proj(t.project),T=today(),od=t.due&&t.due<T&&!t.done;
  const bits=[];
  if(t.due)bits.push(`<span class="${od?'od':''}">${dlabel(t.due)}</span>`);
  if(t.repeat)bits.push(RLAB[t.repeat]);
  if(p&&!view.startsWith('p:'))bits.push(esc(p.name));
  const subs=t.subs.map((s,i)=>`<label class="sub"><input type="checkbox" data-act="sub" data-i="${i}" ${s.d?'checked':''}>${esc(s.t)}</label>`).join('');
  return `<div class="task p${t.pri}${t.done?' done':''}" data-id="${t.id}"><button class="chk" data-act="tog" aria-label="Complete task"></button><div class="tb" data-act="edit"><div class="tt">${esc(t.title)}</div>${bits.length?`<div class="tm">${bits.map(b=>`<span>${b}</span>`).join('')}</div>`:''}${subs}</div></div>`;
}
const section=(title,list,cls)=>`<h2 class="${cls||''}">${title}</h2>`+list.map(taskRow).join('');
function pcard(p){
  const T=today(),ts=S.tasks.filter(t=>t.project===(p.id==='inbox'?null:p.id)),dn=ts.filter(t=>t.done).length,pct=ts.length?Math.round(dn/ts.length*100):0;
  let d='';
  if(p.due){const n=diff(p.due,T);d=`<div class="days${n<0?' over':''}"><div class="big">${n<0?'−'+(-n):n}</div><small>${n<0?'days over':n===0?'due today':n===1?'day left':'days left'}</small></div>`}
  return `<button class="pcard" data-act="open" data-id="${p.id}" style="--pc:${p.color||'var(--accent)'}"><div class="info"><div class="nm">${esc(p.name)}</div><div class="st">${dn} of ${ts.length} done${p.due?' · due '+dlabel(p.due):''}</div><div class="bar"><i style="width:${pct}%"></i></div></div>${d}</button>`;
}
function render(){
  const T=today(),open=S.tasks.filter(t=>!t.done);let h='';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view.startsWith('p:')?'projects':view)));
  if(view==='today'){
    const od=open.filter(t=>t.due&&t.due<T).sort(cmp),td=open.filter(t=>t.due===T).sort(cmp);
    h=`<h1>Today</h1><p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p>`;
    if(od.length)h+=section('Overdue',od,'over');
    if(td.length)h+=(od.length?section('Today',td):td.map(taskRow).join(''));
    if(!od.length&&!td.length)h+='<p class="empty">Nothing due today. Tap + to add a task.</p>';
  }else if(view==='upcoming'){
    h='<h1>Upcoming</h1>';
    const up=open.filter(t=>t.due&&t.due>T).sort(cmp),nd=open.filter(t=>!t.due).sort(cmp);
    const g={};up.forEach(t=>(g[t.due]=g[t.due]||[]).push(t));
    Object.keys(g).sort().forEach(k=>h+=section(dlabel(k),g[k]));
    if(nd.length)h+=section('No date',nd);
    if(!up.length&&!nd.length)h+='<p class="empty">No upcoming tasks.</p>';
  }else if(view==='projects'){
    h='<h1>Projects</h1>';
    const ps=[...S.projects].sort((a,b)=>{const x=a.due||'9',y=b.due||'9';return x<y?-1:x>y?1:0});
    h+='<div style="margin-top:14px">'+pcard({id:'inbox',name:'Inbox'})+ps.map(pcard).join('')+'</div>';
    if(!ps.length)h+='<p class="empty">Add a project to group tasks and give them a due date.</p>';
    h+='<div class="btns"><button class="link" data-act="new-proj">New project</button><button class="link" data-act="backup">Backup and restore</button></div>';
  }else{
    const id=view.slice(2),pid=id==='inbox'?null:id,p=pid?proj(pid):{name:'Inbox'};
    if(pid&&!p){view='projects';return render()}
    const ts=S.tasks.filter(t=>t.project===pid),o=ts.filter(t=>!t.done).sort(cmp),d=ts.filter(t=>t.done);
    h=`<button class="link back" data-v="projects">‹ Projects</button><div class="head"><div><h1>${esc(p.name)}</h1>${p.due?`<p class="sub">Due ${dlabel(p.due)}</p>`:''}</div>${pid?'<button class="link" data-act="edit-proj" data-id="'+pid+'">Edit</button>':''}</div>`;
    h+=o.map(taskRow).join('')||'<p class="empty">No open tasks. Tap + to add one.</p>';
    if(d.length)h+=section('Completed',d);
  }
  $('#app').innerHTML=h;
}
function opts(list,sel){return list.map(([v,l])=>`<option value="${v}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`).join('')}
function openSheet(h){$('#sheet').innerHTML=h;document.body.classList.add('open')}
function closeSheet(){document.body.classList.remove('open');$('#sheet').innerHTML=''}
function taskForm(t){
  const n=!t;
  t=t||{title:'',due:view==='today'?today():'',pri:4,project:view.startsWith('p:')&&view!=='p:inbox'?view.slice(2):null,repeat:'',subs:[]};
  openSheet(`<h3>${n?'New task':'Edit task'}</h3><input id="f-title" placeholder="Task name" value="${esc(t.title)}" autocomplete="off">
  <div class="row"><label>Due<input type="date" id="f-due" value="${t.due||''}"></label><label>Priority<select id="f-pri">${opts([[1,'Urgent'],[2,'High'],[3,'Medium'],[4,'None']],t.pri)}</select></label></div>
  <div class="row"><label>Project<select id="f-proj">${opts([['','Inbox'],...S.projects.map(p=>[p.id,p.name])],t.project||'')}</select></label><label>Repeats<select id="f-rep">${opts([['','Never'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['monthly','Monthly']],t.repeat)}</select></label></div>
  <label>Subtasks, one per line<textarea id="f-subs" rows="3">${esc(t.subs.map(s=>s.t).join('\n'))}</textarea></label>
  <div class="acts">${n?'':`<button class="danger" data-act="del-task" data-id="${t.id}">Delete</button>`}<button data-act="close">Cancel</button><button class="primary" data-act="save-task" data-id="${n?'':t.id}">Save</button></div>`);
  if(n)setTimeout(()=>$('#f-title').focus(),50);
}
function projForm(p){
  const n=!p;p=p||{name:'',due:''};
  openSheet(`<h3>${n?'New project':'Edit project'}</h3><label>Name<input id="f-name" value="${esc(p.name)}" autocomplete="off"></label><label>Due date<input type="date" id="f-pdue" value="${p.due||''}"></label>
  <div class="acts">${n?'':`<button class="danger" data-act="del-proj" data-id="${p.id}">Delete</button>`}<button data-act="close">Cancel</button><button class="primary" data-act="save-proj" data-id="${n?'':p.id}">Save</button></div>`);
  if(n)setTimeout(()=>$('#f-name').focus(),50);
}
function backupForm(){
  openSheet(`<h3>Backup and restore</h3><label>Copy this text somewhere safe. To restore, paste a backup here and replace.<textarea id="f-bk" rows="8">${esc(JSON.stringify(S))}</textarea></label><p id="bk-msg" class="sub"></p>
  <div class="acts"><button data-act="close">Close</button><button data-act="bk-restore">Replace data with this text</button><button class="primary" data-act="bk-copy">Copy</button></div>`);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-v]');if(!el)return;
  if(el.dataset.v){view=el.dataset.v;render();scrollTo(0,0);return}
  const a=el.dataset.act,row=el.closest('.task'),id=row?row.dataset.id:el.dataset.id;
  if(e.target.closest('.sub')&&a!=='sub')return;
  const t=S.tasks.find(x=>x.id===id);
  if(a==='close')closeSheet();
  else if(a==='new-task')taskForm();
  else if(a==='new-proj')projForm();
  else if(a==='open'){view='p:'+id;render();scrollTo(0,0)}
  else if(a==='edit-proj')projForm(proj(id));
  else if(a==='edit'&&t)taskForm(t);
  else if(a==='tog'&&t){if(t.repeat&&t.due&&!t.done){t.due=nextDue(t);t.subs.forEach(s=>s.d=false)}else t.done=!t.done;save();render()}
  else if(a==='sub'&&t){t.subs[+el.dataset.i].d=el.checked;save()}
  else if(a==='save-task'){
    const title=$('#f-title').value.trim();if(!title){$('#f-title').focus();return}
    const old=S.tasks.find(x=>x.id===id),prev=old?old.subs:[];
    const subs=$('#f-subs').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({t:s,d:!!(prev.find(p=>p.t===s)||{}).d}));
    const rep=$('#f-rep').value;let due=$('#f-due').value;if(rep&&!due)due=today();
    const f={title,due,pri:+$('#f-pri').value,project:$('#f-proj').value||null,repeat:rep,subs};
    if(old)Object.assign(old,f);else S.tasks.push({id:uid(),done:false,...f});
    save();closeSheet();render();
  }
  else if(a==='del-task'||a==='del-proj'){
    if(!el.dataset.armed){el.dataset.armed=1;el.textContent=a==='del-proj'?'Tap again: delete project and its tasks':'Tap again to delete';return}
    if(a==='del-task')S.tasks=S.tasks.filter(x=>x.id!==id);
    else{S.projects=S.projects.filter(p=>p.id!==id);S.tasks=S.tasks.filter(x=>x.project!==id);view='projects'}
    save();closeSheet();render();
  }
  else if(a==='save-proj'){
    const name=$('#f-name').value.trim();if(!name){$('#f-name').focus();return}
    const due=$('#f-pdue').value,p=proj(id);
    if(p){p.name=name;p.due=due}else S.projects.push({id:uid(),name,due,color:COL[S.projects.length%COL.length]});
    save();closeSheet();render();
  }
  else if(a==='backup')backupForm();
  else if(a==='bk-copy'){
    const ta=$('#f-bk');ta.select();let ok=false;
    try{navigator.clipboard.writeText(ta.value).then(()=>{$('#bk-msg').textContent='Copied.'},()=>{});ok=true}catch(x){}
    if(!ok){try{document.execCommand('copy');$('#bk-msg').textContent='Copied.'}catch(x){$('#bk-msg').textContent='Select the text and copy it manually.'}}
  }
  else if(a==='bk-restore'){
    try{const d=JSON.parse($('#f-bk').value);if(!Array.isArray(d.tasks)||!Array.isArray(d.projects))throw 0;S=d;save();closeSheet();view='today';render()}
    catch(x){$('#bk-msg').textContent='That text isn’t a valid backup.'}
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(view==='today'||view==='upcoming'))render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
